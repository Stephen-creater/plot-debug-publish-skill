<!doctype html>
<html lang="zh"><head><meta charset="utf-8">
<title>剧情Debug 封面模板</title>
<style>
  /* 模板（来自《幻视任务》1-2 集 v10 定稿 A 版）：复制到 05_视频工程/<作品名>/封面/cover_vN.html 后，
     替换「主体图」「小窗图」的路径和取景、三行大字、右上角标签、进度条文字。字体路径按工程目录写好了，不用改。 */
  @font-face { font-family:'HS'; src:url('../../../04_素材库/字体/HarmonyOS_Sans_SC_Black.ttf'); font-weight:900; }
  @font-face { font-family:'HS'; src:url('../../../04_素材库/字体/HarmonyOS_Sans_SC_Bold.ttf'); font-weight:700; }
  body { margin:0; background:#222; }
  .cv { position:relative; overflow:hidden; margin:0 0 40px; font-family:'HS';
        background-color:#050506;
        background-image:linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
        background-size:46px 46px; }
  .h { width:1920px; height:1080px; }
  .v { width:1242px; height:1656px; }
  .img { position:absolute; background-repeat:no-repeat; }
  .t { position:absolute; white-space:nowrap; line-height:1.0; font-weight:900; transform:skewX(-9deg); transform-origin:left bottom; letter-spacing:-0.01em; }
  .t > span { display:block; }
  .t .ex, .t .ol { position:absolute; left:0; top:0; }
  .t .ex { color:#000; -webkit-text-stroke:var(--sw,26px) #000;
           text-shadow:1px 1px 0 #000,2px 2px 0 #000,3px 3px 0 #050505,4px 4px 0 #080808,5px 5px 0 #0b0b0b,6px 6px 0 #0d0d0d,7px 7px 0 #101010,
                       8px 8px 0 #121212,9px 9px 0 #141414,10px 10px 0 #151515,11px 11px 0 #161616,12px 12px 0 #171717,13px 13px 0 #181818,14px 14px 0 #181818,
                       16px 22px 30px rgba(0,0,0,0.85); }
  .t .ol { color:transparent; -webkit-text-stroke:var(--hw,7px) #5d6168; }
  .t .fi { position:relative; color:transparent; -webkit-background-clip:text; background-clip:text; }
  .w .fi { background-image:linear-gradient(180deg,#ffffff 0%,#f4f6f8 34%,#c3c9d1 50%,#fdfdfd 64%,#e3e7ec 100%); }
  .y .fi { background-image:linear-gradient(180deg,#fff7b0 0%,#ffe33a 30%,#fcd70c 52%,#f2ac00 78%,#ffe45c 100%); }
  .y { filter:drop-shadow(0 0 26px rgba(255,186,18,0.70)) drop-shadow(0 0 6px rgba(255,214,40,0.55)); }
  .r .fi { background-image:linear-gradient(180deg,#ffd0c8 0%,#ff5a46 34%,#e8160a 60%,#b80000 100%); }
  .r { filter:drop-shadow(0 0 24px rgba(255,40,20,0.65)); }
  .lab { position:absolute; padding:8px 26px 12px; background:#FCD70C; color:#0b0b0b; border-radius:16px; font-weight:900; white-space:nowrap;
         box-shadow:0 8px 22px rgba(0,0,0,0.55); }
  /* 删除进度条 */
  .del { position:absolute; background:rgba(8,8,10,0.88); border:4px solid #ff3b2f; border-radius:14px; padding:14px 22px 18px; color:#fff;
         font-weight:900; box-shadow:0 0 30px rgba(255,40,20,0.55), 0 10px 26px rgba(0,0,0,0.6); }
  .del .row { display:flex; justify-content:space-between; align-items:baseline; letter-spacing:0.02em; }
  .del .bar { margin-top:10px; height:22px; border-radius:6px; background:#2a0b09; overflow:hidden; }
  .del .bar i { display:block; height:100%; background:repeating-linear-gradient(90deg,#ff3b2f 0 26px,#ff6a52 26px 34px); }
  /* 圆形小窗 */
  .circ { position:absolute; border-radius:50%; border:10px solid #FCD70C; overflow:hidden; box-shadow:0 0 0 6px #000, 0 14px 30px rgba(0,0,0,0.7); background-color:#000; background-repeat:no-repeat; }
  /* 故障切片 */
  .gl { position:absolute; inset:0; background-repeat:no-repeat; mix-blend-mode:screen; opacity:0.9; }
</style></head><body>

  <div class="t y" style="left:84px; top:360px; font-size:150px;"><span class="ex">贾维斯AI</span><span class="ol">贾维斯AI</span><span class="fi">贾维斯AI</span></div>

  <div class="circ" style="left:90px; top:760px; width:250px; height:250px;

       background-size:860px auto; background-position:-245px -40px;"></div>
  <div class="del" style="left:380px; top:820px; width:560px; font-size:44px;">
    <div class="row"><span>删除 J.A.R.V.I.S.</span><span style="color:#ff5a46">99%</span></div>

</div>

  <div class="img" style="left:0; top:430px; width:1242px; height:1226px;

  <div class="t w" style="left:72px; top:150px; font-size:210px; --sw:32px; --hw:8px;"><span class="ex">奥创没死，</span><span class="ol">奥创没死，</span><span class="fi">奥创没死，</span></div>
  <div class="t y" style="left:72px; top:405px; font-size:150px;"><span class="ex">贾维斯AI</span><span class="ol">贾维斯AI</span><span class="fi">贾维斯AI</span></div>
  <div class="t y" style="left:60px; top:585px; font-size:150px;"><span class="ex">把自己删了！</span><span class="ol">把自己删了！</span><span class="fi">把自己删了！</span></div>
  <div class="circ" style="left:70px; top:1300px; width:270px; height:270px;

       background-size:930px auto; background-position:-265px -45px;"></div>
  <div class="del" style="left:380px; top:1370px; width:740px; font-size:50px;">
    <div class="row"><span>删除 J.A.R.V.I.S.</span><span style="color:#ff5a46">99%</span></div>

  </div>
</div>
</body></html>
